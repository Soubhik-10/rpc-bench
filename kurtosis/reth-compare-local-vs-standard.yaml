# Three-node private Reth comparison network.
#
# Two participants use branch-specific Docker image tags. The final participant
# leaves el_image empty, so ethereum-package uses its standard/default Reth image.
#
# Build the branch images before launching:
#   sh scripts/build_reth_compare_images.sh
#
# Run:
#   kurtosis run --enclave reth-compare github.com/ethpandaops/ethereum-package --args-file kurtosis/reth-compare-local-vs-standard.yaml --image-download always
#
# Then:
#   kurtosis enclave inspect reth-compare
#
# Copy each EL service's mapped rpc port into bench/rpc-endpoints.example.json.
participants:
  - el_type: reth
    # paradigmxyz/reth-oss branch: debug-trace-release-inspector
    el_image: "reth-debug-trace-release-inspector:latest"
    cl_type: lighthouse
    count: 1
    el_storage_type: full

  - el_type: reth
    # paradigmxyz/reth-oss branch: port/nethermind-11755-trace-streaming
    el_image: "reth-nethermind-11755-trace-streaming:latest"
    cl_type: lighthouse
    count: 1
    el_storage_type: full

  - el_type: reth
    # Blank el_image means the ethereum-package standard/default Reth image.
    el_image: ""
    cl_type: lighthouse
    count: 1
    el_storage_type: full

network_params:
  network: kurtosis
  seconds_per_slot: 12
  num_validator_keys_per_node: 64
  # Keep this small comparison net away from PeerDAS/Fulu constraints.
  fulu_fork_epoch: 18446744073709551615
  preregistered_validator_keys_mnemonic: "giant issue aisle success illegal bike spike question tent bar rely arctic volcano long crawl hungry vocal artwork sniff fantasy very lucky have athlete"

additional_services:
  - prometheus
  - grafana
  - dora
  - assertoor
  - spamoor

assertoor_params:
  image: "ethpandaops/assertoor:latest"
  run_stability_check: true
  run_block_proposal_check: true
  run_transaction_test: true
  run_blob_transaction_test: true
  tests: []

spamoor_params:
  image: "ethpandaops/spamoor:latest"
  max_cpu: 2000
  max_mem: 1024
  spammers:
    - name: "EOA transfer load"
      description: "Funded devnet account transfer traffic for RPC trace comparison"
      scenario: eoatx
      config:
        throughput: 20
        max_pending: 80
        max_wallets: 40
        base_fee: 20
    - name: "Contract call load"
      description: "Execution-heavy devnet traffic for debug/trace RPCs"
      scenario: erctx
      config:
        throughput: 5
        max_pending: 30
        max_wallets: 20
        base_fee: 20
  extra_args: []

prometheus_params:
  storage_tsdb_retention_time: "1d"
  storage_tsdb_retention_size: "2GB"

persistent: true
snooper_enabled: true
